[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:api]
command=php -S 127.0.0.1:8000 -t public
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stopsignal=INT
stopwaitsecs=10

[program:reverb]
command=php artisan reverb:start --host=127.0.0.1 --port=8081
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stopsignal=INT
stopwaitsecs=10
environment=REVERB_APP_ID=%(ENV_REVERB_APP_ID)s,REVERB_APP_NAME=%(ENV_REVERB_APP_NAME)s,REVERB_APP_KEY=%(ENV_REVERB_APP_KEY)s,REVERB_APP_SECRET=%(ENV_REVERB_APP_SECRET)s,REVERB_HOST=%(ENV_REVERB_HOST)s,REVERB_PORT=%(ENV_REVERB_PORT)s,REVERB_SCHEME=%(ENV_REVERB_SCHEME)s,REVERB_MAX_REQUEST_SIZE=%(ENV_REVERB_MAX_REQUEST_SIZE)s

[program:nginx]
command=/usr/local/bin/start-nginx.sh
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stopsignal=INT
stopwaitsecs=10
