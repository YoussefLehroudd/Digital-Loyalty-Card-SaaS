name: Customer Growth and Engagement checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  growth-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run referral, feedback, birthday and analytics regression
        run: node scripts/test-customer-engagement.cjs
