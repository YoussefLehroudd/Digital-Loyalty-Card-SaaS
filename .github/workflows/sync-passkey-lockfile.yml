name: Sync passkey dependency lockfile
on:
  push:
    branches: [fix/pwa-persistent-login-passkeys-20261028]
permissions:
  contents: write
jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock exactly reviewed authentication dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Commit updated lockfile to feature branch
        run: |
          if git diff --quiet -- frontend/package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: synchronize passkey package-lock"
          git push origin HEAD:fix/pwa-persistent-login-passkeys-20261028
