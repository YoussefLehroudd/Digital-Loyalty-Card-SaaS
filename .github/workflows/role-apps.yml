name: Role PWA install and passkey security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  role-pwa-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node scripts/test-role-apps.cjs
      - run: node scripts/test-mobile-nav-persistence.cjs
      - run: node scripts/test-mobile-preferences-nav.cjs
