name: Smart Campaigns build checks
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/smart-campaigns-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nextjs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:affiliate-access
      - run: node scripts/test-smart-campaigns.cjs
