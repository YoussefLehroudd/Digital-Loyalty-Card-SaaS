name: Build Loyvance Android APK
on:
  push:
    paths:
      - 'android-twa/**'
      - '.github/workflows/loyvance-android.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. android-v1.0.0)'
        required: true
        default: 'android-v1.0.0'
permissions:
  contents: write
jobs:
  android-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug APK for CI validation
        working-directory: android-twa
        run: gradle :app:assembleDebug --no-daemon
      - name: Save test APK (not the public release)
        uses: actions/upload-artifact@v4
        with:
          name: Loyvance-Android-Debug-CI
          path: android-twa/app/build/outputs/apk/debug/app-debug.apk
  android:
    if: github.event_name == 'workflow_dispatch'
    needs: android-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify release signing is configured
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "::error::Configure the four Android signing secrets before publishing an APK."
            exit 1
          }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/loyvance-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/loyvance-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Assemble signed release
        working-directory: android-twa
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK signature and calculate certificate fingerprint
        run: |
          APK="android-twa/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -E 'SHA256:'
          cp "$APK" Loyvance-Android.apk
      - name: Publish signed APK on Loyvance website
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p frontend/public/downloads
          cp Loyvance-Android.apk frontend/public/downloads/Loyvance-Android.apk

          FINGERPRINT="$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | sed -n 's/.*SHA256: //p' | head -1 | tr -d '\r')"
          export FINGERPRINT
          test -n "$FINGERPRINT"
          python3 - <<'PY'
          import json, os
          fingerprint=os.environ["FINGERPRINT"].strip()
          data={"available": True, "version": os.environ["RELEASE_TAG"], "sha256_cert_fingerprints":[fingerprint]}
          with open("frontend/src/lib/android-release.json","w",encoding="utf-8") as f:
              json.dump(data,f,indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/downloads/Loyvance-Android.apk frontend/src/lib/android-release.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish signed Loyvance Android APK on the website"
            git push origin HEAD:main
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Loyvance-Android.apk --clobber
          else
            gh release create "$RELEASE_TAG" Loyvance-Android.apk --title "Loyvance Android $RELEASE_TAG" --notes "Official signed APK. Also offered at https://loyvance.vercel.app/download/android."
          fi
          echo "Signed Android APK published to GitHub Releases and Loyvance website."
          echo "Fingerprint: $FINGERPRINT"
