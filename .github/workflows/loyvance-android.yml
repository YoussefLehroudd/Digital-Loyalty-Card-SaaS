name: Build Loyvance Android APK
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. android-v1.0.0)'
        required: true
        default: 'android-v1.0.0'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify release signing is configured
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "::error::Configure the four Android signing secrets before publishing an APK."
            exit 1
          }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/loyvance-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/loyvance-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Assemble signed release
        working-directory: android-twa
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK signature and calculate certificate fingerprint
        run: |
          APK="android-twa/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -E 'SHA256:'
          cp "$APK" Loyvance-Android.apk
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Loyvance-Android.apk --clobber
          else
            gh release create "$RELEASE_TAG" Loyvance-Android.apk --title "Loyvance Android $RELEASE_TAG" --notes "Signed Android Trusted Web Activity. Requires matching SHA-256 in https://loyvance.vercel.app/.well-known/assetlinks.json."
          fi
          echo "Publish the printed signing-certificate SHA256 as LOYVANCE_ANDROID_SHA256 in Vercel."
